site_name: SofEduc — Documentation
site_description: Plateforme EdTech française pour générer, distribuer et corriger des devoirs en ligne ou sur feuille.
site_url: https://jeanroberthumbert.github.io/GenExoV2/
repo_url: https://github.com/JeanRobertHumbert/GenExoV2
repo_name: JeanRobertHumbert/GenExoV2
edit_uri: edit/fusion/main/docs/
copyright: Copyright &copy; 2024-2026 Jean-Robert Humbert — Licence propriétaire.

theme:
  name: material
  language: fr
  logo: https://fonts.gstatic.com/s/i/materialiconsoutlined/school/v6/24px.svg
  favicon: https://fonts.gstatic.com/s/i/materialiconsoutlined/school/v6/24px.svg
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Mode sombre
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Mode clair
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

nav:
  - Accueil: index.md
  - Bilan par rôle: roles.md
  - Architecture: architecture.md
  - Authoring d'exercices: authoring.md
  - Format JSON: donnees-json.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JeanRobertHumbert/GenExoV2
    - icon: fontawesome/solid/envelope
      link: mailto:jeanroberthumbert@gmail.com
